<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="shortcut icon" href="../static/images/task.ico" th:href="@{/images/task.ico}" type="image/x-icon">
    <link rel="stylesheet" href="../static/main.css" th:href="@{/main.css}">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Tasks</title>
</head>
<body class="flex justify-center">

    <div class="container flex justify-center">
        <table class="mt-5">
            <tr>
                <th>ID</th>
                <th>Description</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            <tr th:each="task : ${listTasks}">
                <td th:text="${task.id}"></td>
                <td th:text="${task.description}"></td>
                <td th:text="${task.status}"></td>
                <td>
                    <button class="bg-blue-500 text-white pt-2 pl-4 pr-4 pb-2
                    rounded-xl m-2 hover:bg-black button-edit button" data-id="1"  th:attr="data-id=${task.id}">Edit</button>
                    <button class="bg-blue-500 text-white pt-2 pl-4 pr-4 pb-2
                    rounded-xl m-2 hover:bg-black button-delete button" data-id="1" th:attr="data-id=${task.id}">Delete</button>
                </td>
            </tr>
        </table>
        <div class="wrap_form mt-5">
            <form action="/create" th:action="@{/create}" method="post" th:method="POST" class="flex-col flex ml-10">

                <input type="text" name="description" placeholder="Description" class="form_item">
                <select name="status" class="form_item">
                    <option value='IN_PROGRESS' selected>IN_PROGRESS</option>
                    <option value='DONE'>DONE</option>
                    <option value='PAUSED'>PAUSED</option>
                </select>
                <button class="bg-blue-500 text-white pt-2 pl-4 pr-4 pb-2
                    rounded-xl m-2 hover:bg-black button" type="submit">Create</button>
            </form>
            <div class="wrap_a flex justify-center ml-10">
                <div class="mt-3" th:each="page : ${Pages}">
                    <a th:href="@{'/page/' + ${page}}" th:text="${page}"  class="bg-blue-500 text-white pl-4 pr-4 pt-2 pb-2 w-10 h-10 mr-2 rounded-xl hover:bg-black button"></a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script th:src="@{/main.js}"></script>
</body>
</html>
